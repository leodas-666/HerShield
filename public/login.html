<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HerShield</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      padding-top: 80px;
      margin: 0;
    }

    input {
      padding: 10px;
      width: 220px;
      margin: 5px 0;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    form {
      display: inline-block;
    }
  </style>
</head>

<body>

  <h1>HerShield Login</h1>

  <form method="POST" action="/login">
    <input name="username" placeholder="Username" required><br>
    <input name="password" type="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>

</body>
</html>
